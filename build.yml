
name: Build SoulWeapons

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulWeapons-Updated.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip SoulWeapons-Updated.zip -d project
          cp -a project/. .
          rm -rf project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SoulWeapons-JAR
          path: target/*.jar
          
